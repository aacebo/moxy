name: Bug Report
description: Report unexpected behavior in Moxy
title: "[Bug]: "
labels:
  - bug
assignees:
  - aacebo
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before filing a new report.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and the behavior you expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: Provide the smallest complete Rust example that demonstrates the problem.
      placeholder: |
        use moxy::ast::Item;

        fn main() {
            let item: Item = moxy::parse!("struct Example;").unwrap();
            println!("{item:?}");
        }
      render: rust
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: Include the observed output or error.
      render: text
    validations:
      required: true

  - type: input
    id: moxy-version
    attributes:
      label: Moxy Version
      placeholder: "0.5.6"
    validations:
      required: true

  - type: input
    id: rust-version
    attributes:
      label: Rust Version
      placeholder: "rustc 1.98.0"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: false
