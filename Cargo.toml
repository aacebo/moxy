[workspace]
resolver = "3"
members = [".", "crates/*"]
default-members = [".", "crates/*"]
exclude = ["archive/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/moxy"
homepage = "https://www.github.com/aacebo/moxy"
repository = "https://www.github.com/aacebo/moxy"
keywords = ["macro", "framework", "proc", "rust"]
categories = ["development-tools::procedural-macro-helpers", "rust-patterns", "no-std"]

[workspace.lints.clippy]
collapsible-if = "allow"
new-ret-no-self = "allow"

[package]
name = "moxy"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
default = []
ast = ["moxy-ast"]
token = ["moxy-token"]
diagnostic = ["moxy-diagnostic"]
macros = ["moxy-macros"]
serde = ["moxy-ast/serde", "moxy-token/serde"]
proc-macro2 = ["moxy-token/proc-macro2"]

[dependencies]
moxy-ast = { path = "crates/moxy-ast", optional = true }
moxy-diagnostic = { path = "crates/moxy-diagnostic", optional = true }
moxy-macros = { path = "crates/moxy-macros", optional = true }
moxy-token = { path = "crates/moxy-token", optional = true }
