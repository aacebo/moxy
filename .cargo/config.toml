[build]
jobs = -1

[env]
RUST_BACKTRACE = "1"
# RUST_TEST_NOCAPTURE = "1"

[net]
retry = 3

[alias]
lint = "clippy --workspace --all-features --all-targets -- -D warnings"
cov = "llvm-cov --workspace --all-features --html --open"
cov-check = "llvm-cov --workspace --all-features --fail-under-lines 90"
